name: Enviar lista de almoços

on:
  schedule:
    # 13:05 UTC = 10:05 em Brasília — logo após o corte de edição dos pais (10h),
    # para que a cozinha receba a lista já fechada.
    - cron: '5 13 * * 1-5'
  workflow_dispatch:

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar API de envio
        run: |
          curl -s -X POST "${{ secrets.API_URL }}/enviar-lista" \
            -H "X-Secret: ${{ secrets.LISTA_SECRET }}" \
            --fail \
            && echo "Lista enviada com sucesso" \
            || echo "Erro ao enviar lista"
