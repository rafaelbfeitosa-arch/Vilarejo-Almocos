name: Enviar lista de almoços

on:
  schedule:
    # 13:05 UTC = 10:05 em Brasília — logo após o corte de edição dos pais (10h),
    # para que a cozinha receba a lista já fechada.
    - cron: '5 13 * * 1-5'
  workflow_dispatch:

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar API de envio
        run: |
          # Nenhum fallback engolindo o erro: um envio que falha precisa derrubar
          # o step, senão o GitHub mostra verde e ninguém descobre que a cozinha
          # ficou sem lista.
          # --fail       -> HTTP >= 400 vira código de saída != 0
          # --show-error -> mostra o motivo apesar do --silent
          # --retry      -> só reprova erro transitório (5xx, rede); 403 não é
          #                 retentado, porque secret errado não melhora tentando
          curl --fail --silent --show-error \
               --retry 3 --retry-delay 15 \
               --max-time 180 \
               -X POST "${{ secrets.API_URL }}/enviar-lista" \
               -H "X-Secret: ${{ secrets.LISTA_SECRET }}"
          echo
          echo "Lista enviada com sucesso"
